<html>
    <div
        id="my_box_realtime"
        style="background-color: red; position: absolute; right: 70px; bottom: 70px; min-width: 100px; min-height: 100px"
    ></div>

    <script type="text/javascript">
        let box = document.getElementById("my_box_realtime");

        let right = 70;
        let bottom = 70;

        let interval = setInterval(function () {
            right -= 1;
            bottom -= 1;

            box.style.right = right + "px";
            box.style.bottom = bottom + "px";

            if (right <= 0 && bottom <= 0) {
                clearInterval(interval);
            }
        }, 500);
    </script>
</html>
